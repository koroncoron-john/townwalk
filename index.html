<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>TownWalk — お散歩ショッピング</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="description" content="横スクロールで町を歩いて、お店をのぞいて、オンラインストアへ。お散歩ショッピングゲーム TownWalk。">
<meta name="theme-color" content="#8fd4f2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="assets/icon-512.png">
<link rel="icon" href="assets/icon-192.png">
<link rel="preload" as="font" type="font/woff2" href="assets/mp1.woff2" crossorigin>
<link rel="preload" as="image" href="assets/ground_tile.webp">
</head>
<body>
<style>
@font-face{
  font-family:'MP1'; src:url('assets/mp1.woff2') format('woff2');
  font-weight:100 900; font-style:normal; font-display:swap;
}
:root{
  --ink:#3d2a18; --wood:#7a5a2e; --wood-d:#4a3418; --gold:#e8b64c;
  --font:'MP1','Hiragino Maru Gothic ProN','Hiragino Sans',system-ui,sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{
  margin:0; height:100%; overflow:hidden; background:#0e1620; font-family:var(--font);
  /* iOS: 長押しの「コピー/保存」メニュー・文字選択・ダブルタップ拡大を止める */
  -webkit-touch-callout:none;
  -webkit-user-select:none; user-select:none;
  touch-action:manipulation;
  overscroll-behavior:none;
}
/* 画像の長押しで「画像を保存」が出るのを防ぐ。クリックは親のボタンが受ける */
img{
  -webkit-touch-callout:none; -webkit-user-drag:none;
  pointer-events:none; user-select:none;
}
/* 入力欄だけは選択・コピーできるようにしておく */
input,textarea{-webkit-user-select:text; user-select:text; -webkit-touch-callout:default;}

#viewport{position:fixed; inset:0; display:flex; align-items:center; justify-content:center;}
#stage{
  position:relative; width:1536px; height:864px; flex:0 0 auto; transform-origin:center center;
  overflow:hidden; background:#8fd4f2; user-select:none;
}

#sky{position:absolute; left:0; top:0; height:864px;}   /* 幅は起動時に算出 */
#sky img{width:100%; height:100%; object-fit:cover; object-position:center 62%; display:block;}
#world{position:absolute; left:0; top:0; height:864px;} /* 幅は起動時に算出 */
.ent{position:absolute;}
.ent img{display:block; width:100%; height:100%; object-fit:contain; object-position:center bottom;}

/* NPC がゆっくり呼吸する */
.npcimg{transform-origin:center bottom; animation:idle 2.8s ease-in-out infinite;}
@keyframes idle{0%,100%{transform:scaleY(1) scaleX(1)}50%{transform:scaleY(1.022) scaleX(.994)}}

.npc-bubble{
  position:absolute; left:50%; bottom:calc(100% + 10px); transform:translateX(-50%) scale(.6);
  background:#fffdf5; border:4px solid var(--ink); border-radius:18px; padding:8px 16px;
  font-size:20px; font-weight:700; color:var(--ink); white-space:nowrap;
  opacity:0; transition:opacity .22s, transform .22s cubic-bezier(.34,1.6,.64,1); pointer-events:none;
  box-shadow:0 5px 0 rgba(0,0,0,.18); z-index:60;
}
.npc-bubble::after{content:''; position:absolute; left:50%; bottom:-16px; margin-left:-10px; border:10px solid transparent; border-top-color:var(--ink);}
.npc-bubble::before{content:''; position:absolute; left:50%; bottom:-9px; margin-left:-7px; z-index:1; border:7px solid transparent; border-top-color:#fffdf5;}
.npc-bubble.show{opacity:1; transform:translateX(-50%) scale(1);}

.done-badge{
  position:absolute; right:0; top:-8px; width:52px; height:52px; border-radius:50%;
  background:#4ec26a; border:5px solid #fff; color:#fff; font-size:28px; font-weight:800;
  display:none; align-items:center; justify-content:center; box-shadow:0 4px 0 rgba(0,0,0,.25); z-index:30;
}
.done-badge.on{display:flex;}

#player{position:absolute; width:120px; height:132px; z-index:50;}
#pshadow{
  position:absolute; left:50%; bottom:-4px; width:74px; height:16px; border-radius:50%;
  background:rgba(30,50,20,.3); filter:blur(4px); transform:translateX(-50%); z-index:-1;
}
#pimg{width:100%; height:100%; object-fit:contain; object-position:center bottom; transform-origin:center bottom;}
#hint{
  position:absolute; left:50%; bottom:calc(100% + 4px); transform:translateX(-50%);
  background:var(--gold); border:4px solid var(--wood-d); border-radius:14px; padding:5px 15px;
  font-size:21px; font-weight:800; color:var(--wood-d); white-space:nowrap; opacity:0;
  transition:opacity .15s; box-shadow:0 4px 0 rgba(0,0,0,.2); z-index:70;
}
#hint.show{opacity:1; animation:bob .9s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-7px)}}

/* ---------- HUD ---------- */
.hud{position:absolute; z-index:100;}
#stampCard{
  left:26px; top:22px; width:520px;
  background:linear-gradient(#f7ecd2,#e6d0a4); border:5px solid var(--wood);
  border-radius:20px; padding:12px 20px 14px 92px; box-shadow:0 6px 0 rgba(0,0,0,.25);
}
#stampCard .who{
  position:absolute; left:-14px; top:-14px; width:96px; height:96px; border-radius:20px;
  border:5px solid #fff; background:#cfe6f5; overflow:hidden; box-shadow:0 4px 0 rgba(0,0,0,.2);
}
#stampCard .who img{width:100%; height:100%; object-fit:contain; object-position:center bottom;}
#stampCard .ttl{text-align:center; font-size:25px; font-weight:800; color:var(--ink); margin-bottom:9px;}
#stampCard .slots{display:flex; gap:10px; justify-content:center;}
.slot{
  width:54px; height:54px; border-radius:50%; border:4px solid var(--wood); overflow:hidden;
  background:#fffdf5; display:flex; align-items:center; justify-content:center;
  transition:transform .3s cubic-bezier(.34,1.7,.64,1);
}
.slot img{width:88%; height:88%; object-fit:contain;}
.slot.pop{transform:scale(1.5) rotate(-14deg);}
#stampCard .hint{
  margin-top:11px; background:#fffdf5; border:3px solid var(--wood); border-radius:12px;
  text-align:center; font-size:18px; font-weight:700; color:var(--wood-d); padding:5px;
}
.iconbtn{
  width:104px; height:104px; border-radius:20px; border:4px solid var(--gold);
  background:linear-gradient(#3a3630,#1c1a16); color:#fff; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  box-shadow:0 6px 0 rgba(0,0,0,.35); transition:transform .09s; position:relative; padding:0; font-family:var(--font);
}
.iconbtn:active{transform:translateY(5px); box-shadow:0 1px 0 rgba(0,0,0,.35);}
.iconbtn .gl{width:52px; height:52px;} .iconbtn .gl svg{width:100%; height:100%;}
.iconbtn .lb{font-size:16px; font-weight:800;}
.iconbtn .badge{
  position:absolute; right:-8px; top:-8px; min-width:30px; height:30px; border-radius:15px;
  background:#e5462f; border:3px solid #fff; color:#fff; font-size:17px; font-weight:800;
  display:flex; align-items:center; justify-content:center; padding:0 5px;
}
#topRight{right:24px; top:22px; display:flex; gap:14px;}
#sideRight{right:24px; top:150px; display:flex; flex-direction:column; gap:14px;}

#pad{
  left:40px; bottom:34px; width:250px; height:250px; border-radius:50%;
  background:radial-gradient(circle at 38% 32%, rgba(107,97,87,.5), rgba(46,40,34,.55) 78%);
  border:5px solid rgba(255,255,255,.3); box-shadow:0 8px 0 rgba(0,0,0,.18); touch-action:none;
  opacity:.55; transition:opacity .18s ease;
  backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px);
}
/* 操作中だけはっきり見せる */
#pad.grabbing{opacity:.95;}
#pad .ar{position:absolute; color:#fff; font-size:34px; opacity:.85; pointer-events:none; text-shadow:0 2px 3px rgba(0,0,0,.6);}
#pad .ar.u{left:50%; top:12px; transform:translateX(-50%);}
#pad .ar.d{left:50%; bottom:12px; transform:translateX(-50%);}
#pad .ar.l{left:14px; top:50%; transform:translateY(-50%);}
#pad .ar.r{right:14px; top:50%; transform:translateY(-50%);}
#pad .ar.on{opacity:1; color:var(--gold);}
#knob{
  position:absolute; left:50%; top:50%; width:96px; height:96px; margin:-48px 0 0 -48px;
  border-radius:50%; background:radial-gradient(circle at 36% 30%, #cfc3ae, #6d5f4a);
  border:4px solid rgba(255,255,255,.4); box-shadow:0 4px 10px rgba(0,0,0,.4); pointer-events:none;
}
#notice{
  left:50%; bottom:30px; transform:translateX(-50%); width:820px;
  background:rgba(28,26,22,.86); border:3px solid rgba(255,255,255,.3); border-radius:999px;
  color:#fff; display:flex; align-items:center; gap:14px; padding:13px 28px; font-size:22px; font-weight:700;
}
#notice .tri{margin-left:auto; color:var(--gold); font-size:19px;}

#veil{position:absolute; inset:0; background:rgba(20,16,10,.66); z-index:200; display:none; align-items:center; justify-content:center; padding:36px;}
#veil.on{display:flex;}
.sheet{
  background:linear-gradient(#fffdf5,#f3e6cc); border:6px solid var(--wood); border-radius:26px;
  box-shadow:0 12px 0 rgba(0,0,0,.3); max-width:1060px; width:100%; max-height:100%; overflow:auto; padding:26px 32px 30px;
}
.sheet h2{margin:0 0 6px; font-size:36px; font-weight:800; color:var(--ink);}
.sheet .cat{display:inline-block; background:var(--gold); color:var(--wood-d); border:3px solid var(--wood-d);
  border-radius:999px; padding:2px 16px; font-size:18px; font-weight:800; margin-bottom:14px;}
.sheet p{font-size:20px; line-height:1.75; color:#4a3826; margin:0 0 16px;}
.lognote{background:#fff6dd; border:4px solid var(--gold); border-radius:16px;
  padding:16px 20px; font-size:19px; line-height:1.7; color:#5c4526; margin:4px 0 14px;}
.flabel{display:block; font-size:17px; font-weight:800; color:#6b5a44; margin:12px 0 5px;}
.finput{width:100%; font-family:var(--font); font-size:21px; padding:12px 14px;
  border:4px solid var(--wood); border-radius:12px; background:#fff; color:var(--ink);}
.authmsg{min-height:26px; font-size:17px; font-weight:800; color:#b5432a; margin-top:8px;}
.authmsg.ok{color:#2f7d4f;}
.titlegrid{display:flex; flex-wrap:wrap; gap:10px; margin:4px 0 16px;}
.titlechip{border:3px solid var(--wood); border-radius:999px; padding:6px 16px;
  font-size:17px; font-weight:800; background:#fff; color:#8b7a62;}
.titlechip.on{background:var(--gold); color:var(--wood-d); border-color:var(--wood-d);}
.shoprow{display:grid; grid-template-columns:300px 1fr; gap:22px; align-items:center; margin-bottom:18px;}
.shoppic{background:#dff0fa; border:4px solid var(--wood); border-radius:18px; padding:10px; height:280px;}
.shoppic img{width:100%; height:100%; object-fit:contain;}
.photos{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.photos .cell{aspect-ratio:4/3; border:3px dashed #5c7b9b; border-radius:12px; background:rgba(255,255,255,.7);
  display:flex; flex-direction:column; align-items:center; justify-content:center; color:#456883; font-weight:700; font-size:15px;}
.photos .cell em{font-style:normal; font-size:12px; color:#7b93a8;}
.rowbtn{display:flex; gap:16px; flex-wrap:wrap;}
.bigbtn{
  flex:1; min-width:230px; border:5px solid var(--wood-d); border-radius:18px; cursor:pointer;
  font-family:var(--font); font-size:25px; font-weight:800; padding:17px 20px;
  box-shadow:0 6px 0 rgba(0,0,0,.28); transition:transform .09s; color:var(--wood-d);
}
.bigbtn:active{transform:translateY(5px); box-shadow:0 1px 0 rgba(0,0,0,.28);}
.bigbtn.go{background:linear-gradient(#7ad46f,#4bb04a); color:#123; border-color:#2c6b2c;}
.bigbtn.close{background:linear-gradient(#f3e6cc,#dcc79c);}
.menulist{display:flex; flex-direction:column; gap:11px;}
.menulist button{
  text-align:left; font-family:var(--font); font-size:23px; font-weight:700; color:var(--wood-d);
  background:#fffdf5; border:4px solid var(--wood); border-radius:16px; padding:15px 22px; cursor:pointer;
  box-shadow:0 4px 0 rgba(0,0,0,.2); transition:transform .09s; display:flex; align-items:center; gap:14px;
}
.menulist button:active{transform:translateY(4px); box-shadow:0 0 0 rgba(0,0,0,.2);}
.menulist button.danger{color:#a33; border-color:#c98;}
.menulist button img{width:44px; height:44px; object-fit:contain;}

#toast{
  position:absolute; left:50%; top:118px; transform:translateX(-50%) translateY(-20px);
  background:var(--gold); border:5px solid var(--wood-d); border-radius:20px;
  padding:15px 34px; font-size:27px; font-weight:800; color:var(--wood-d); z-index:300;
  opacity:0; transition:opacity .25s, transform .25s cubic-bezier(.34,1.6,.64,1);
  box-shadow:0 6px 0 rgba(0,0,0,.28); pointer-events:none; white-space:nowrap;
}
#toast.on{opacity:1; transform:translateX(-50%) translateY(0);}

#rotate{position:fixed; inset:0; background:#12202c; color:#fff; z-index:9999; display:none;
  flex-direction:column; align-items:center; justify-content:center; gap:20px; font-size:26px; font-weight:800; text-align:center;}
#rotate .ic{font-size:88px; animation:rot 1.8s ease-in-out infinite;}
@keyframes rot{0%,40%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait){ #rotate{display:flex;} }
</style>

<div id="viewport">
  <div id="stage">
    <div id="sky"><img id="skyimg" src="assets/bg_summer.webp" alt=""></div>
    <div id="world"></div>

    <div class="hud" id="stampCard">
      <div class="who"><img src="assets/p_r.webp" alt=""></div>
      <div class="ttl">スタンプカード</div>
      <div class="slots" id="slots"></div>
      <div class="hint" id="stampHint">ショップを訪れてスタンプを集めよう！</div>
    </div>

    <div class="hud" id="topRight"></div>
    <div class="hud" id="sideRight"></div>

    <div class="hud" id="pad">
      <span class="ar u" data-d="up">▲</span><span class="ar d" data-d="down">▼</span>
      <span class="ar l" data-d="left">◀</span><span class="ar r" data-d="right">▶</span>
      <div id="knob"></div>
    </div>

    <div class="hud" id="notice">
      <span>💬</span><span id="noticeText">【お知らせ】ようこそ、TownWalkへ！</span><span class="tri">▲</span>
    </div>

    <div id="toast"></div>
    <div id="veil"><div class="sheet" id="sheet"></div></div>
  </div>
</div>
<div id="rotate"><div class="ic">📱</div><div>よこむきにしてあそんでね</div></div>

<script src="config.js?v=2"></script>
<script type="module">
const IMG={
  groundTile:'assets/ground_tile.webp', platform:'assets/platform.webp', ladder:'assets/ladder.webp',
  shop_shop:'assets/shop_shop.webp', shop_flower:'assets/shop_flower.webp', shop_store:'assets/shop_store.webp', shop_sea:'assets/shop_sea.webp',
  npc1:'assets/npc1.webp', npc2:'assets/npc2.webp', npc3:'assets/npc3.webp',
  npc4:'assets/npc4.webp', npc5:'assets/npc5.webp', npc6:'assets/npc6.webp',
  p_l:'assets/p_l.webp', p_r:'assets/p_r.webp', p_up:'assets/p_up.webp'
};

/* 店長キャラの実寸（トリミング後）— 表示高さ130pxに対する横幅の算出用 */
const NPC_AR = window.TW_CONFIG.NPC_AR;

/* === 支給画像の実測値から算出したレイアウト ===
   ground1(1814x230) 芝の面 = 高さの32% / ground2(1213x166) 芝の面 = 高さの23%
   スプライトは透明余白をトリミング済みなので、下端＝接地点 */
const L = window.TW_CONFIG.LAYOUT;              // 管理画面プレビューと共有
const W=L.W, SW=1536, SH=L.SH;
const GROUND_Y=L.GROUND_Y, UPPER_Y=L.UPPER_Y;
const GROUND_H=L.GROUND_H, GROUND_TOP=L.GROUND_TOP;
const PLAT_H=L.PLAT_H, PLAT_TOP=L.PLAT_TOP;
const PLATFORMS=L.PLATFORMS, LADDERS=L.LADDERS;
const LADDER_W=L.LADDER_W, LADDER_TOP=L.LADDER_TOP, LADDER_H=L.LADDER_H, LADDER_HALF=L.LADDER_HALF;
const SINK_SHOP=L.SINK_SHOP, SINK_CHAR=L.SINK_CHAR;
const SPEED=5.4, CLIMB=4.6;
const SKY_W=2000;                                  // 背景画像は1800px。ほぼ等倍で使う
const PARALLAX=(SKY_W-SW)/Math.max(1,(W-SW));      // 端まで使い切る係数

/* 店舗データは Supabase から読み込む（管理画面で編集できる） */
let SHOPS=[];

const S={x:520,y:GROUND_Y,level:'ground',climbing:false,face:1,phase:0,visited:new Set(),sound:true};
const IN={left:false,right:false,up:false,down:false};
function el(id){return document.getElementById(id);}
const stage=el('stage'), world=el('world'), sky=el('sky');

function buildWorld(){
  let h='';
  // 地面：継ぎ目のないタイルを横に繰り返す
  h+=`<div class="ent" style="left:0;top:${GROUND_TOP}px;width:${W}px;height:${GROUND_H}px;z-index:3;`
    +`background:url(${IMG.groundTile}) repeat-x left bottom/auto ${GROUND_H}px"></div>`;
  // 2階の足場と、それぞれに付く縄ばしご
  PLATFORMS.forEach(pf=>{
    h+=`<div class="ent" style="left:${pf.x}px;top:${PLAT_TOP}px;width:${pf.w}px;height:${PLAT_H}px;z-index:4"><img src="${IMG.platform}" alt=""></div>`;
  });
  LADDERS.forEach(lx=>{
    h+=`<div class="ent" style="left:${lx-LADDER_W/2}px;top:${LADDER_TOP}px;width:${LADDER_W}px;height:${LADDER_H}px;z-index:6"><img src="${IMG.ladder}" alt=""></div>`;
  });
  SHOPS.forEach((s,i)=>{
    const base = s.level==='upper'?UPPER_Y:GROUND_Y;
    h+=`<div class="ent" style="left:${s.cx-s.w/2}px;top:${base-s.h+SINK_SHOP}px;width:${s.w}px;height:${s.h}px;z-index:${s.level==='upper'?10:20}">`
      +`<div class="done-badge" id="badge-${s.id}">✓</div><img src="${IMG[s.img]}" alt="${s.name}"></div>`;
    h+=`<div class="ent" style="left:${s.npcX-s.npcW/2}px;top:${base-130+SINK_CHAR}px;width:${s.npcW}px;height:130px;z-index:${s.level==='upper'?12:22}">`
      +`<div class="npc-bubble" id="bub-${s.id}"></div>`
      +`<img class="npcimg" style="animation-delay:${i*0.6}s" src="${IMG[s.npc]}" alt=""></div>`;
  });
  h+=`<div id="player"><div id="hint">↑ おす</div><div id="pshadow"></div><img id="pimg" src="${IMG.p_r}" alt=""></div>`;
  world.innerHTML=h;
}

const ICONS={
  crown:'<svg viewBox="0 0 24 24" fill="#e8b64c" stroke="#5b430f" stroke-width="1.4" stroke-linejoin="round"><path d="M3 8l4 3 5-6 5 6 4-3-2 11H5z"/></svg>',
  mail:'<svg viewBox="0 0 24 24" fill="#fff" stroke="#3a3a3a" stroke-width="1.5" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M3 6.5l9 6.5 9-6.5" fill="none"/></svg>',
  menu:'<svg viewBox="0 0 24 24" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
  gift:'<svg viewBox="0 0 24 24" stroke="#7a3b2e" stroke-width="1.3" stroke-linejoin="round"><rect x="3" y="9" width="18" height="12" rx="1.5" fill="#e5462f"/><rect x="2" y="6" width="20" height="4" rx="1.2" fill="#f2704f"/><path d="M12 6v15" stroke="#ffd76a" stroke-width="2.4"/><path d="M12 6C9 6 7 3 9 2.4S12 4.5 12 6zM12 6c3 0 5-3 3-3.6S12 4.5 12 6z" fill="#ffd76a"/></svg>',
  store:'<svg viewBox="0 0 24 24" stroke="#5b3a1e" stroke-width="1.2" stroke-linejoin="round"><path d="M3 9h18v11H3z" fill="#f6e7c9"/><path d="M2.5 5h19l1.2 4H1.3z" fill="#e5462f"/><path d="M5.3 5l-.8 4M9.1 5l-.4 4M14.9 5l.4 4M18.7 5l.8 4" stroke="#fff" stroke-width="1.6"/><rect x="9" y="13" width="6" height="7" fill="#b98a4e"/></svg>',
};
const btn=(id,svg,label,badge)=>`<button class="iconbtn" data-open="${id}"><span class="gl">${svg}</span><span class="lb">${label}</span>${badge?`<span class="badge">${badge}</span>`:''}</button>`;
function buildHUD(){
  el('topRight').innerHTML=btn('mypage',ICONS.crown,'マイページ')+btn('news',ICONS.mail,'お知らせ','!')+btn('menu',ICONS.menu,'メニュー');
  el('sideRight').innerHTML=btn('gift',ICONS.gift,'プレゼント')+btn('shoplist',ICONS.store,'ショップ');
  el('slots').innerHTML=SHOPS.map(s=>`<div class="slot" id="slot-${s.id}"></div>`).join('');

let AC=null;
function beep(f,d,t){ if(!S.sound)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain(); o.type=t||'sine'; o.frequency.value=f;
    g.gain.setValueAtTime(.0001,AC.currentTime); g.gain.exponentialRampToValueAtTime(.16,AC.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+d+.02);}catch(e){}
}
const seOpen=()=>{beep(660,.09);setTimeout(()=>beep(880,.12),70);};
const seStamp=()=>{beep(784,.1);setTimeout(()=>beep(1047,.1),90);setTimeout(()=>beep(1319,.22),180);};
const seClose=()=>beep(420,.09,'triangle');
let stepFlip=0;
const seStep=()=>{ stepFlip^=1; beep(stepFlip?150:126,.05,'triangle'); };

function bindInput(){
  const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down'};
  addEventListener('keydown',e=>{const k=map[e.key]; if(!k)return; e.preventDefault(); if(!IN[k]&&k==='up')tryAction(); IN[k]=true;});
  addEventListener('keyup',e=>{const k=map[e.key]; if(k){e.preventDefault(); IN[k]=false;}});
  const pad=el('pad'),knob=el('knob'); let active=false;
  const set=(dx,dy)=>{const dead=18;
    IN.left=dx<-dead; IN.right=dx>dead; IN.up=dy<-dead; IN.down=dy>dead;
    pad.querySelectorAll('.ar').forEach(a=>a.classList.toggle('on',IN[a.dataset.d]));
    const m=Math.min(1,Math.hypot(dx,dy)/78),ang=Math.atan2(dy,dx);
    knob.style.transform=`translate(${Math.cos(ang)*m*52}px,${Math.sin(ang)*m*52}px)`;};
  const clear=()=>{active=false; IN.left=IN.right=IN.up=IN.down=false;
    pad.classList.remove('grabbing');
    pad.querySelectorAll('.ar').forEach(a=>a.classList.remove('on')); knob.style.transform='';};
  const pos=e=>{const r=pad.getBoundingClientRect(),t=e.touches?e.touches[0]:e,sc=r.width/250;
    return [(t.clientX-r.left)/sc-125,(t.clientY-r.top)/sc-125];};
  pad.addEventListener('pointerdown',e=>{e.preventDefault(); active=true;
    pad.classList.add('grabbing');
    try{pad.setPointerCapture(e.pointerId);}catch(_){} const[x,y]=pos(e); if(y<-18)tryAction(); set(x,y);});
  pad.addEventListener('pointermove',e=>{if(!active)return; e.preventDefault();
    const[x,y]=pos(e); const was=IN.up; set(x,y); if(!was&&IN.up)tryAction();});
  addEventListener('pointerup',clear); addEventListener('pointercancel',clear);
}

const shopAt=()=>SHOPS.find(s=>s.level===S.level && Math.abs(S.x-s.cx)<s.w/2+35 && !S.climbing)||null;
const onLadder=()=>LADDERS.some(lx=>Math.abs(S.x-lx)<LADDER_HALF);
function tryAction(){
  if(el('veil').classList.contains('on'))return;
  const s=shopAt(); if(s){enterShop(s); return;}
  if(onLadder()&&(S.level==='ground'||S.climbing)) S.climbing=true;
}

let lastStep=0;
function tick(){
  const modal=el('veil').classList.contains('on');
  let moving=false;
  if(!modal){
    if(S.climbing){
      if(IN.up)S.y-=CLIMB; if(IN.down)S.y+=CLIMB;
      if(IN.up||IN.down) moving=true;
      if(S.y<=UPPER_Y){S.y=UPPER_Y; S.climbing=false; S.level='upper';}
      if(S.y>=GROUND_Y){S.y=GROUND_Y; S.climbing=false; S.level='ground';}
    }else{
      if(IN.left){S.x-=SPEED; S.face=-1; moving=true;}
      if(IN.right){S.x+=SPEED; S.face=1; moving=true;}
      if(S.level==='upper'){
        const pf = PLATFORMS.find(p=>S.x>=p.x-40 && S.x<=p.x+p.w+40) || PLATFORMS[0];
        S.x=Math.max(pf.x+50,Math.min(pf.x+pf.w-50,S.x)); S.y=UPPER_Y;
        if(IN.down&&onLadder()) S.climbing=true;
      }else{ S.x=Math.max(90,Math.min(W-90,S.x)); S.y=GROUND_Y; }
    }
  }

  /* ---- 歩行アニメーション ---- */
  const pimg=el('pimg'), psh=el('pshadow');
  if(moving) S.phase += S.climbing?0.20:0.30; else S.phase=0;
  let tf='', shSc=1, shOp=.3;
  if(S.climbing){
    tf=`translateX(${Math.sin(S.phase)*4}px)`; shOp=0;
  }else if(moving){
    const bob=Math.abs(Math.sin(S.phase))*7;
    tf=`translateY(${-bob}px) rotate(${Math.sin(S.phase)*3.5}deg)`;
    shSc=1-bob/26; shOp=.3-bob/70;
    const st=Math.floor(S.phase/Math.PI);
    if(st!==lastStep){ lastStep=st; seStep(); }
  }else{
    tf=`scaleY(${1+Math.sin(performance.now()/650)*0.012})`;
  }
  pimg.style.transform=tf;
  psh.style.transform=`translateX(-50%) scale(${shSc})`;
  psh.style.opacity=shOp;

  const p=el('player');
  p.style.left=(S.x-60)+'px'; p.style.top=(S.y-132+SINK_CHAR)+'px';
  const want=S.climbing?IMG.p_up:(S.face<0?IMG.p_l:IMG.p_r);
  if(pimg.getAttribute('src')!==want) pimg.setAttribute('src',want);

  const cam=Math.max(0,Math.min(W-SW,S.x-SW/2));
  world.style.transform=`translateX(${-cam}px)`;
  sky.style.transform=`translateX(${-cam*PARALLAX}px)`;

  const s=shopAt(), hn=el('hint');
  if(s){ hn.textContent=S.visited.has(s.id)?'↑ もういちど見る':'↑ おみせに入る'; hn.classList.add('show'); }
  else if(onLadder()&&!S.climbing&&S.level==='ground'){ hn.textContent='↑ のぼる'; hn.classList.add('show'); }
  else hn.classList.remove('show');

  SHOPS.forEach(v=>{
    const near=v.level===S.level && Math.abs(S.x-v.npcX)<230;
    const b=el('bub-'+v.id);
    if(near&&!b.classList.contains('show')){ b.textContent=v.greet[Math.floor(Math.random()*v.greet.length)]; b.classList.add('show'); }
    else if(!near) b.classList.remove('show');
  });
  requestAnimationFrame(tick);
}

/* =====================================================================
   Supabase 連携
   - 未ログイン：スタンプは端末（localStorage）にだけ保存
   - ログイン後：DB に保存され、他の端末でも続きから／称号がもらえる
   ===================================================================== */
const DB = {
  sb:null, user:null, displayName:'ゲスト', titleName:null, notices:[],

  async init(){
    const C=window.TW_CONFIG;
    try{
      const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
      this.sb = createClient(C.SUPABASE_URL, C.SUPABASE_KEY);
      const { data:{ session } } = await this.sb.auth.getSession();
      if(session) await this.onSignedIn(session.user);
    }catch(e){ console.warn('Supabase 未接続のためオフラインで動作します', e); }
  },

  /* ---- 店舗 ---- */
  async loadShops(){
    let rows=null;
    if(this.sb){
      const { data, error } = await this.sb.from('published_shops').select('*');
      if(error) console.warn('店舗の取得に失敗', error); else rows=data;
    }
    if(rows && rows.length){
      try{ localStorage.setItem('townwalk_shops', JSON.stringify(rows)); }catch(_){}
    }else{
      try{ rows = JSON.parse(localStorage.getItem('townwalk_shops')||'null'); }catch(_){}
    }
    if(!rows || !rows.length) return [];
    return rows.map(r=>{
      const npc=r.npc_key||'npc5';
      const h=130, w=Math.round(h*(NPC_AR[npc]||0.8));
      return {
        id:r.id, name:r.name, cat:r.category||'', desc:r.description||'',
        ec:r.ec_url||null, sign:r.sign_text||'',
        img:r.building_key||'shop_shop', npc,
        level:r.floor==='upper'?'upper':'ground',
        cx:r.pos_x, w:r.display_w, h:r.display_h,
        npcX:r.pos_x+(r.npc_offset_x??-180), npcW:w,
        greet:[]
      };
    });
  },
  async loadGreetings(shops){
    if(!this.sb || !shops.length) return;
    const { data } = await this.sb.from('shop_messages')
      .select('shop_id, body').in('shop_id', shops.map(s=>s.id)).order('sort_order');
    (data||[]).forEach(m=>{ const s=shops.find(x=>x.id===m.shop_id); if(s) s.greet.push(m.body); });
    shops.forEach(s=>{ if(!s.greet.length) s.greet=['いらっしゃいませ〜！']; });
  },

  /* ---- お知らせ ---- */
  async loadNotices(){
    if(!this.sb) return;
    const { data } = await this.sb.from('notices')
      .select('title, body').order('publish_at',{ascending:false}).limit(8);
    if(data && data.length){
      this.notices = data;
      NOTICE_TEXTS = data.map(n=>'【お知らせ】'+n.title);
      el('noticeText').textContent = NOTICE_TEXTS[0];
    }
  },

  /* ---- スタンプ ---- */
  lsKey(){ return 'townwalk_stamps'; },
  localStamps(){ try{ return JSON.parse(localStorage.getItem(this.lsKey())||'[]'); }catch(_){ return []; } },
  async loadStamps(){
    if(this.sb && this.user){
      const { data } = await this.sb.from('stamps').select('shop_id').eq('user_id', this.user.id);
      const ids=(data||[]).map(r=>r.shop_id);
      // 未ログイン中に集めた分を引き継ぐ
      const local=this.localStamps().filter(id=>!ids.includes(id));
      if(local.length){
        await this.sb.from('stamps').insert(local.map(shop_id=>({user_id:this.user.id, shop_id})));
        localStorage.removeItem(this.lsKey());
        local.forEach(id=>ids.push(id));
      }
      return ids;
    }
    return this.localStamps();
  },
  async saveStamp(shopId){
    if(this.sb && this.user){
      await this.sb.from('stamps').insert({user_id:this.user.id, shop_id:shopId});
    }else{
      const a=this.localStamps(); if(!a.includes(shopId)){ a.push(shopId);
        try{ localStorage.setItem(this.lsKey(), JSON.stringify(a)); }catch(_){} }
    }
  },

  /* ---- 称号 ---- */
  async refreshTitles(){
    if(!this.sb || !this.user) return null;
    const { data } = await this.sb.from('profiles')
      .select('display_name, equipped_title_code, titles:equipped_title_code(name)')
      .eq('id', this.user.id).single();
    if(data){ this.displayName=data.display_name||'プレイヤー'; this.titleName=data.titles?.name||null; }
    return this.titleName;
  },
  async renderTitles(box){
    const [{data:all},{data:mine}] = await Promise.all([
      this.sb.from('titles').select('code,name,description').order('sort_order'),
      this.sb.from('user_titles').select('title_code').eq('user_id', this.user.id),
    ]);
    const got=new Set((mine||[]).map(t=>t.title_code));
    box.innerHTML = `<p style="margin-bottom:6px"><b>称号</b>（${got.size} / ${(all||[]).length}）</p>
      <div class="titlegrid">`+ (all||[]).map(t=>
        `<span class="titlechip ${got.has(t.code)?'on':''}" title="${esc(t.description)}">${got.has(t.code)?esc(t.name):'？？？'}</span>`
      ).join('') + `</div>`;
  },

  /* ---- 認証 ---- */
  async onSignedIn(u){
    this.user=u;
    await this.refreshTitles();
  },
  async authAction(mode){
    const m=el('authMsg'); const email=el('mpEmail').value.trim(), pw=el('mpPw').value;
    if(!this.sb){ m.textContent='いまサーバーにつながりません'; return; }
    if(!email||pw.length<6){ m.textContent='メールアドレスと6文字以上のパスワードを入れてね'; return; }
    m.className='authmsg'; m.textContent='……';
    const { data, error } = mode==='login'
      ? await this.sb.auth.signInWithPassword({ email, password:pw })
      : await this.sb.auth.signUp({ email, password:pw });
    if(error){ m.textContent='うまくいきませんでした：'+error.message; return; }
    if(!data.session){ m.className='authmsg ok'; m.textContent='確認メールを送りました。メールを開いて登録を完了してね。'; return; }
    await this.onSignedIn(data.session.user);
    const ids=await this.loadStamps();
    ids.forEach(id=>S.visited.add(id));
    syncStampCard();
    closePanel(); toast('ログインしました！');
  },
  async signOut(){
    if(this.sb) await this.sb.auth.signOut();
    this.user=null; this.titleName=null; this.displayName='ゲスト';
  },
};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function syncStampCard(){
  SHOPS.forEach(s=>{
    const slot=el('slot-'+s.id), badge=el('badge-'+s.id);
    if(!slot) return;
    if(S.visited.has(s.id)){
      slot.innerHTML=`<img src="${IMG[s.img]}" alt="">`;
      slot.style.background='#ffe9b0'; slot.style.borderColor='#4a3418';
      if(badge) badge.classList.add('on');
    }else{
      slot.innerHTML=''; slot.style.background=''; slot.style.borderColor='';
      if(badge) badge.classList.remove('on');
    }
  });
  const left=SHOPS.length-S.visited.size;
  el('stampHint').textContent = SHOPS.length===0 ? 'お店を準備中です'
    : left>0 ? `のこり ${left} 店舗！` : 'ぜんぶ集めた！';
}

  // 横スクロール領域に合わせて世界と空の幅を決める
  world.style.width = W + 'px';
  // 空は背景画像(1800px)を引き伸ばしすぎない幅に固定し、
  // その余白ぶんだけをスクロール全体に配分する（遠景なので動きは控えめでよい）
  sky.style.width = SKY_W + 'px';

  await DB.init();
  SHOPS = await DB.loadShops();
  if(!SHOPS.length){
    el('stampHint').textContent='お店を準備中です';
    el('noticeText').textContent='【お知らせ】ただいま準備中です';
  }
  await DB.loadGreetings(SHOPS);
  buildWorld(); buildHUD(); bindInput(); fit(); tick();

  if('serviceWorker' in navigator && location.protocol==='https:'){
    navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW登録失敗',e));
  }

  const ids = await DB.loadStamps();
  ids.forEach(id=>S.visited.add(id));
  syncStampCard();
  DB.loadNotices();
})();
</script>

</body>
</html>
